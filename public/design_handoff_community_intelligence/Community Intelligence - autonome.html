  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Bienfait — Couleurs\n   Aligné sur le site de référence (« Deep Dive ») :\n   crème chaleureux · vert Bienfait · bleu profond · tuiles inclinées\n   ========================================================================== */\n:root {\n  /* --- Verts / Marque ----------------------------------------------------\n     SEULS VERTS AUTORISÉS. Aucun autre vert, jamais.                       */\n  --vert-logo:      #23CD8E;   /* vert Bienfait */\n  --vert-pastel:    #E6F7EF;   /* vert pastel — tuile / surface teintée */\n\n  /* --- Bleu profond (accent de marque du site) -------------------------- */\n  --bleu:           #05339C;\n  --bleu-clair:     #0A44BE;\n  --bleu-bg:        #EAF0FB;   /* tuile / surface teintée bleue */\n\n  /* --- Fondations & encre ----------------------------------------------- */\n  --fond:           #E9E6DF;   /* fond de page */\n  --surface-creme:  #FAF8F3;   /* section douce */\n  --panneau:        #F4F1EC;   /* panneau */\n  --carte-claire:   #FFFFFF;   /* carte */\n  --creme-fonce:    #ECEBE8;\n  --encre:          #1C1A16;   /* encre chaude — texte */\n  --encre-froide:   #1E2A3A;   /* encre bleutée — ombres / sur bleu */\n\n  /* --- Accents pastel (secondaires, atténués) --------------------------- */\n  --pastel-jaune:   #F4DC94;\n  --pastel-violet:  #D9CCF2;\n\n  /* --- Lignes ----------------------------------------------------------- */\n  --bordure:        #D3CEC5;   /* ligne franche */\n  --bordure-carte:  #E7E3DB;   /* contour de carte */\n  --bordure-douce:  #E4E0D8;\n\n  /* --- Alias sémantiques ------------------------------------------------ */\n  --surface-page:      var(--fond);\n  --surface-section:   var(--surface-creme);\n  --surface-panneau:   var(--panneau);\n  --surface-card:      var(--carte-claire);\n  --surface-inverse:   var(--encre);\n\n  --text-body:         var(--encre);\n  --text-muted:        #5B564C;\n  --text-on-inverse:   var(--surface-creme);\n  --text-on-primaire:  var(--encre);\n  --text-on-bleu:      #FFFFFF;\n\n  --accent-primaire:   var(--vert-logo);\n  --accent-fort:       var(--bleu);\n  --accent-bleu:       var(--bleu);\n  --focus-ring:        var(--bleu);\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Bienfait — Typographie\n   ========================================================================== */\n:root {\n  --font-corps:  \"Plus Jakarta Sans\", system-ui, sans-serif; /* police unique de la marque */\n  --font-titres: var(--font-corps); /* alias de compatibilité — Jakarta partout */\n\n  /* Graisses */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Échelle typographique (rem) */\n  --fs-display:  4rem;    /* héros */\n  --fs-h1:       2.75rem;\n  --fs-h2:       2rem;\n  --fs-h3:       1.5rem;\n  --fs-lead:     1.25rem;\n  --fs-body:     1rem;\n  --fs-small:    0.875rem;\n  --fs-eyebrow:  0.8rem;\n\n  /* Interlignage */\n  --lh-titres:  1.1; /* @kind font */\n  --lh-corps:   1.6; /* @kind font */\n\n  /* Interlettrage */\n  --ls-eyebrow: 0.08em;\n  --ls-titres:  -0.01em;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Bienfait — Espacement, rayons & élévation\n   ========================================================================== */\n:root {\n  /* Échelle d'espacement (base 4px) */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n\n  /* Rayons */\n  --rayon-carte:  18px;\n  --rayon-champ:  12px;\n  --rayon-bouton: 999px; /* pilule */\n  --rayon-chip:   999px;\n\n  /* Élévation (encre bleutée, douce) */\n  --ombre-carte:       0 1px 2px rgba(30, 42, 58, 0.05);\n  --ombre-carte-hover: 0 10px 28px rgba(30, 42, 58, 0.12);\n  --ombre-flottante:   0 18px 44px rgba(30, 42, 58, 0.16);\n\n  /* Inclinaison — motif signature (tuiles/vignettes légèrement pivotées) */\n  --tilt-sm:  -3deg;  /* @kind other */\n  --tilt-md:   7deg;  /* @kind other */\n  --tilt-lg:  -12deg; /* @kind other */\n\n  /* Largeur de contenu */\n  --max-contenu: 1160px;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Bienfait — Base / éléments globaux\n   ========================================================================== */\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-body);\n  font-family: var(--font-corps);\n  font-size: var(--fs-body);\n  line-height: var(--lh-corps);\n  text-wrap: pretty;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3 {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n  line-height: var(--lh-titres);\n  letter-spacing: var(--ls-titres);\n}\n/* Emphase — Jakarta (plus de Playfair) */\n.accent {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n}\n.accent-italic {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n}\n.eyebrow {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent-fort);\n}\n\na { color: var(--accent-fort); text-decoration: underline; text-underline-offset: 2px; }\na:hover { color: var(--bleu-clair); }\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Bienfait — Design System · point d'entrée global\n   Consumers link this single file.\n   ============================================================== né sur le site de référence (« Deep Dive ») :\n   crème chaleureux · vert Bienfait · bleu profond · tuiles inclinées\n   ========================================================================== */\n:root {\n  /* --- Verts / Marque ----------------------------------------------------\n     SEULS VERTS AUTORISÉS. Aucun autre vert, jamais.                       */\n  --vert-logo:      #23CD8E;   /* vert Bienfait */\n  --vert-pastel:    #E6F7EF;   /* vert pastel — tuile / surface teintée */\n\n  /* --- Bleu profond (accent de marque du site) -------------------------- */\n  --bleu:           #05339C;\n  --bleu-clair:     #0A44BE;\n  --bleu-bg:        #EAF0FB;   /* tuile / surface teintée bleue */\n\n  /* --- Fondations & encre ----------------------------------------------- */\n  --fond:           #E9E6DF;   /* fond de page */\n  --surface-creme:  #FAF8F3;   /* section douce */\n  --panneau:        #F4F1EC;   /* panneau */\n  --carte-claire:   #FFFFFF;   /* carte */\n  --creme-fonce:    #ECEBE8;\n  --encre:          #1C1A16;   /* encre chaude — texte */\n  --encre-froide:   #1E2A3A;   /* encre bleutée — ombres / sur bleu */\n\n  /* --- Accents pastel (secondaires, atténués) --------------------------- */\n  --pastel-jaune:   #F4DC94;\n  --pastel-violet:  #D9CCF2;\n\n  /* --- Lignes ----------------------------------------------------------- */\n  --bordure:        #D3CEC5;   /* ligne franche */\n  --bordure-carte:  #E7E3DB;   /* contour de carte */\n  --bordure-douce:  #E4E0D8;\n\n  /* --- Alias sémantiques ------------------------------------------------ */\n  --surface-page:      var(--fond);\n  --surface-section:   var(--surface-creme);\n  --surface-panneau:   var(--panneau);\n  --surface-card:      var(--carte-claire);\n  --surface-inverse:   var(--encre);\n\n  --text-body:         var(--encre);\n  --text-muted:        #5B564C;\n  --text-on-inverse:   var(--surface-creme);\n  --text-on-primaire:  var(--encre);\n  --text-on-bleu:      #FFFFFF;\n\n  --accent-primaire:   var(--vert-logo);\n  --accent-fort:       var(--bleu);\n  --accent-bleu:       var(--bleu);\n  --focus-ring:        var(--bleu);\n}\n\n/* ==========================================================================\n   Bienfait — Typographie\n   ========================================================================== */\n:root {\n  --font-corps:  \"Plus Jakarta Sans\", system-ui, sans-serif; /* police unique de la marque */\n  --font-titres: var(--font-corps); /* alias de compatibilité — Jakarta partout */\n\n  /* Graisses */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* Échelle typographique (rem) */\n  --fs-display:  4rem;    /* héros */\n  --fs-h1:       2.75rem;\n  --fs-h2:       2rem;\n  --fs-h3:       1.5rem;\n  --fs-lead:     1.25rem;\n  --fs-body:     1rem;\n  --fs-small:    0.875rem;\n  --fs-eyebrow:  0.8rem;\n\n  /* Interlignage */\n  --lh-titres:  1.1; /* @kind font */\n  --lh-corps:   1.6; /* @kind font */\n\n  /* Interlettrage */\n  --ls-eyebrow: 0.08em;\n  --ls-titres:  -0.01em;\n}\n\n/* ==========================================================================\n   Bienfait — Espacement, rayons & élévation\n   ========================================================================== */\n:root {\n  /* Échelle d'espacement (base 4px) */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n\n  /* Rayons */\n  --rayon-carte:  18px;\n  --rayon-champ:  12px;\n  --rayon-bouton: 999px; /* pilule */\n  --rayon-chip:   999px;\n\n  /* Élévation (encre bleutée, douce) */\n  --ombre-carte:       0 1px 2px rgba(30, 42, 58, 0.05);\n  --ombre-carte-hover: 0 10px 28px rgba(30, 42, 58, 0.12);\n  --ombre-flottante:   0 18px 44px rgba(30, 42, 58, 0.16);\n\n  /* Inclinaison — motif signature (tuiles/vignettes légèrement pivotées) */\n  --tilt-sm:  -3deg;  /* @kind other */\n  --tilt-md:   7deg;  /* @kind other */\n  --tilt-lg:  -12deg; /* @kind other */\n\n  /* Largeur de contenu */\n  --max-contenu: 1160px;\n}\n\n/* ==========================================================================\n   Bienfait — Base / éléments globaux\n   ========================================================================== */\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-body);\n  font-family: var(--font-corps);\n  font-size: var(--fs-body);\n  line-height: var(--lh-corps);\n  text-wrap: pretty;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3 {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n  line-height: var(--lh-titres);\n  letter-spacing: var(--ls-titres);\n}\n/* Emphase — Jakarta (plus de Playfair) */\n.accent {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n}\n.accent-italic {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-extrabold);\n}\n.eyebrow {\n  font-family: var(--font-corps);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent-fort);\n}\n\na { color: var(--accent-fort); text-decoration: underline; text-underline-offset: 2px; }\na:hover { color: var(--bleu-clair); }\n\n<\u002Fstyle>\n<script src=\"5a145c86-decf-408a-80ae-e655f1cfb557\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: var(--fond); }\n  a { color: var(--bleu); text-decoration: none; }\n  a:hover { color: var(--bleu-clair); text-decoration: underline; }\n  table { border-collapse: collapse; }\n  input, select, button { font-family: inherit; }\n  ::selection { background: var(--vert-pastel); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display: flex; height: 100vh; overflow: hidden; font-family: var(--font-corps); color: var(--encre) ound: none; border: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--bleu); text-decoration: underline;\">Régler la cadence d'import<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fx-import>\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"encre\" interactive=\"{{ no }}\" hint-size=\"100%,200px\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0;\">\n                <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(250,248,243,0.5);\">Non calculable aujourd'hui<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.5;\">\n                  <div>Date exacte de désabonnement — Meta n'expose aucun événement de désabonnement.<\u002Fdiv>\n                  <div>Coût par abonné réel par campagne — nécessite l'accès au Gestionnaire de publicités.<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ goCatalogue }}\" style=\"align-self: flex-start; cursor: pointer; background: none; border: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--vert-logo); text-decoration: underline;\">Voir les 42 fonctionnalités et leur statut<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAcq }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1280px; min-width: 0;\">\n\n          <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n            <h1 style=\"margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em;\">Qualité d'acquisition<\u002Fh1>\n            <span style=\"font-size: 13px; color: var(--text-muted);\">Survie des abonnés par semaine d'arrivée · 6 948 comptes comparables · 27 mai → 27 août<\u002Fspan>\n          <\u002Fdiv>\n\n          <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,320px\">\n            <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n                <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Coût réel par pic d'acquisition<\u002Fh2>\n                <span style=\"font-size: 12px; color: var(--text-muted);\">Horizon retenu : {{ horizonLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background: var(--panneau); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">Les 19 055 abonnés gagnés annoncés par les Insights et les 6 948 comptes suivis par les cohortes ne décrivent pas la même population. Le budget se saisit donc pic par pic, et chaque pic porte son propre volume et sa propre rétention. Les périodes de campagne sont inférées des pics d'acquisition, non confirmées.<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; align-items: stretch;\">\n                <div style=\"border: 1px solid var(--bordure-carte); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; justify-content: center;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Budget saisi<\u002Fdiv>\n                  <div style=\"font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; line-height: 1; white-space: nowrap;\">{{ budTotLabel }}<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: var(--text-muted);\">{{ volTotLabel }} abonnés recrutés sur les pics renseignés<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border: 1px solid var(--bordure-carte); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; justify-content: center;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Coût par abonné brut<\u002Fdiv>\n                  <div style=\"font-size: clamp(24px, 3vw, 38px); font-weight: 700; letter-spacing: -0.02em; color: var(--text-muted); line-height: 1; white-space: nowrap;\">{{ coutBrutTot }}<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: var(--text-muted);\">Le chiffre habituellement présenté.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background: var(--encre); color: var(--surface-creme); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 0;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(250,248,243,0.55);\">Coût par abonné conservé à {{ horizonLabel }}<\u002Fdiv>\n                  <div style=\"font-size: clamp(34px, 5.2vw, 64px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--vert-logo); white-space: nowrap;\">{{ coutReelTot }}<\u002Fdiv>\n                  <div style=\"font-size: 14px; color: rgba(250,248,243,0.8);\">Soit {{ ecartTot }} le coût affiché. {{ consTotLabel }} abonnés encore présents.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-x: auto; min-width: 0;\">\n                <sc-raw-table style=\"width: 100%; min-width: 900px; font-size: 14px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"text-align: left; color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\">\n                      <sc-raw-th style=\"padding: 0 8px 10px 0; font-weight: 600;\">Pic<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Volume<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Multiple<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Part nocturne<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Rétention<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Conservés<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600;\">Budget<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Coût brut<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600; text-align: right;\">Coût conservé<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ peaks }}\" as=\"p\" hint-placeholder-count=\"5\">\n                      <sc-raw-tr style=\"border-top: 1px solid var(--bordure-carte);\">\n                        <sc-raw-td style=\"padding: 12px 8px 12px 0;\">\n                          <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                            <span style=\"font-weight: 600;\">{{ p.k }}<\u002Fspan>\n                            <span style=\"align-self: flex-start; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; background: {{ p.natureBg }};\">{{ p.nature }}<\u002Fspan>\n                            <span style=\"font-size: 12px; color: var(--text-muted);\">{{ p.forme }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums;\">{{ p.vol }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ p.mult }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ p.nuit }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600;\">{{ p.ret }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ p.cons }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px;\">\n                          <sc-if value=\"{{ agence }}\" hint-placeholder-val=\"{{ true }}\">\n                            <div style=\"display: flex; align-items: center; gap: 6px; border: 1px solid var(--bordure); background: var(--surface-creme); border-radius: 10px; padding: 6px 10px; width: 116px;\">\n                              <input value=\"{{ p.budget }}\" sc-camel-on-change=\"{{ p.onBudget }}\" placeholder=\"—\" inputmode=\"numeric\" style=\"border: 0; background: transparent; outline: none; width: 100%; min-width: 0; font-size: 14px; font-weight: 700; color: var(--encre);\">\n                              <span style=\"font-size: 13px; font-weight: 700; color: var(--text-muted);\">€<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ lecture }}\">\n                            <span style=\"font-size: 13px; color: var(--text-muted);\">saisie réservée à l'agence<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 8px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ p.brut }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 12px 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700;\">{{ p.reel }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start;\">\n\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,520px\">\n              <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Survie par cohorte d'arrivée<\u002Fh2>\n                  <span style=\"font-size: 13px; color: var(--text-muted);\">Taux brut observé, et taux ramené à un horizon commun pour que les cohortes soient comparables.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--bordure); border-radius: 12px; padding: 12px 16px; background: var(--surface-creme);\">\n                  <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 13px;\">\n                    <span style=\"font-weight: 600;\">Horizon commun<\u002Fspan>\n                    <span style=\"font-weight: 700; font-variant-numeric: tabular-nums;\">{{ horizonLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <input type=\"range\" min=\"30\" max=\"90\" step=\"1\" value=\"{{ horizon }}\" sc-camel-on-change=\"{{ onHorizon }}\" style=\"width: 100%; accent-color: #05339C;\">\n                  <div style=\"font-size: 12px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">Tous les taux sont ramenés à cette ancienneté. Les cohortes exposées moins longtemps passent en statut insuffisant, avec la raison, et restent affichées.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"overflow-x: auto; min-width: 0;\">\n                <sc-raw-table style=\"width: 100%; min-width: 540px; font-size: 14px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"text-align: left; color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\">\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600;\">Semaine<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Effectif<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Partis<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600; text-align: right;\">Taux brut<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 8px 10px; font-weight: 600;\">Taux à l'horizon<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600; text-align: right;\">Exposition<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                      <sc-raw-tr style=\"border-top: 1px solid var(--bordure-carte); background: {{ r.rowBg }};\">\n                        <sc-raw-td style=\"padding: 11px 0; font-weight: 600; color: {{ r.fg }};\">\n                          {{ r.key }}\n                          <sc-if value=\"{{ r.insuff }}\">\n                            <div style=\"font-size: 11px; font-weight: 500; color: var(--text-muted); line-height: 1.4;\">Insuffisant — {{ r.raison }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums; color: {{ r.fg }};\">{{ r.n }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums; color: {{ r.fg }};\">{{ r.lost }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ r.brut }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 8px;\">\n                          <div style=\"display: flex; align-items: center; gap: 10px;\">\n                            <div style=\"flex: 1; height: 6px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: {{ r.barW }}; height: 100%; background: {{ r.barBg }};\"><\u002Fdiv><\u002Fdiv>\n                            <span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: {{ r.fg }};\">{{ r.tronque }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ r.exp }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n                <\u002Fdiv>\n                <div style=\"font-size: 13px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">Le taux à l'horizon est le taux brut ramené à la part des départs déjà survenus à cette ancienneté, mesurée sur la distribution des 1 138 départs par âge d'abonnement. Aucune valeur n'est extrapolée au-delà de la dernière observation.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,520px\">\n              <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Courbe de survie<\u002Fh2>\n                  <span style=\"font-size: 13px; color: var(--text-muted);\">En abscisse, les jours écoulés depuis l'arrivée — pas la date. Les courbes s'arrêtent là où l'observation s'arrête.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                  <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"8\">\n                    <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"cursor: pointer; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }};\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 640 330\" style=\"width: 100%; height: auto;\">\n                  <sc-for list=\"{{ grid }}\" as=\"g\" hint-placeholder-count=\"5\">\n                    <g>\n                      <line x1=\"52\" x2=\"628\" y1=\"{{ g.y }}\" y2=\"{{ g.y }}\" stroke=\"#E7E3DB\" stroke-width=\"1\"><\u002Fline>\n                      <text x=\"44\" y=\"{{ g.ty }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#5B564C\">{{ g.label }}<\u002Ftext>\n                    <\u002Fg>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ xticks }}\" as=\"t\" hint-placeholder-count=\"7\">\n                    <text x=\"{{ t.x }}\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5B564C\">{{ t.label }}<\u002Ftext>\n                  <\u002Fsc-for>\n                  <line x1=\"{{ hx }}\" x2=\"{{ hx }}\" y1=\"24\" y2=\"300\" stroke=\"#1C1A16\" stroke-width=\"1\" stroke-dasharray=\"4 4\"><\u002Fline>\n                  <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"8\">\n                    <g>\n                      <polyline points=\"{{ l.solid }}\" fill=\"none\" stroke=\"{{ l.color }}\" stroke-width=\"{{ l.w }}\"><\u002Fpolyline>\n                      <circle cx=\"{{ l.cx }}\" cy=\"{{ l.cy }}\" r=\"3.5\" fill=\"{{ l.color }}\"><\u002Fcircle>\n                      <text x=\"{{ l.lx }}\" y=\"{{ l.ly }}\" font-size=\"11\" font-weight=\"700\" fill=\"{{ l.color }}\">{{ l.label }}<\u002Ftext>\n                    <\u002Fg>\n                  <\u002Fsc-for>\n                <\u002Fsvg>\n                <div style=\"font-size: 12px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">Chaque courbe s'arrête à sa dernière observation réelle : aucune projection au-delà. La forme entre l'arrivée et cette dernière observation suit la distribution des départs par âge mesurée sur les 1 138 départs. Le trait vertical marque l'horizon commun retenu.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n\n          <\u002Fdiv>\n          <div style=\"background: var(--encre); color: var(--surface-creme); border-radius: 18px; padding: 18px 22px; display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"font-size: 14px; line-height: 1.55; text-wrap: pretty;\">Meta annonce 9 260 désabonnements. Nous en identifions 1 138 nommément, soit 12,3 %. L'écart tient à la fenêtre glissante de l'export : les abonnés arrivés avant le 27 mai n'y figurent pas.<\u002Fdiv>\n            <div style=\"font-size: 14px; color: rgba(250,248,243,0.75); line-height: 1.55; text-wrap: pretty;\">Un export sur toute la période porterait cette couverture à près de 100 %.<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isBoot }}\">\n        <div style=\"max-width: 760px; margin: 40px auto; display: flex; flex-direction: column; gap: 22px; min-width: 0;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Eden Park · aucun import<\u002Fdiv>\n          <h1 style=\"margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.01em; text-wrap: pretty;\">Rien à analyser pour l'instant<\u002Fh1>\n          <p style=\"margin: 0; font-size: 16px; color: var(--text-muted); line-height: 1.6; text-wrap: pretty;\">L'application travaille exclusivement sur les exports officiels Instagram. Le premier export établit l'état de départ ; c'est la comparaison avec le deuxième qui produit la liste des désabonnés et les cohortes.<\u002Fp>\n          <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,260px\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n              <div style=\"font-size: 15px; font-weight: 700;\">Générer un export Instagram<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.55;\">\n                <div style=\"display: flex; gap: 12px;\"><span style=\"flex: 0 0 22px; height: 22px; border-radius: 999px; background: var(--vert-pastel); display: grid; place-items: center; font-size: 12px; font-weight: 700;\">1<\u002Fspan><span>Compte professionnel Instagram, menu Paramètres, puis Centre de comptes.<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; gap: 12px;\"><span style=\"flex: 0 0 22px; height: 22px; border-radius: 999px; background: var(--vert-pastel); display: grid; place-items: center; font-size: 12px; font-weight: 700;\">2<\u002Fspan><span>Vos informations et autorisations, puis Télécharger vos informations.<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; gap: 12px;\"><span style=\"flex: 0 0 22px; height: 22px; border-radius: 999px; background: var(--vert-pastel); display: grid; place-items: center; font-size: 12px; font-weight: 700;\">3<\u002Fspan><span>Format JSON, période « toutes les données », qualité maximale. Meta envoie l'archive par e-mail sous 24 à 48 heures.<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; gap: 12px;\"><span style=\"flex: 0 0 22px; height: 22px; border-radius: 999px; background: var(--vert-pastel); display: grid; place-items: center; font-size: 12px; font-weight: 700;\">4<\u002Fspan><span>Déposez l'archive telle quelle. Les fichiers hors périmètre — contenu des conversations privées, répertoire téléphonique, données de connexion — sont écartés avant traitement et jamais lus. Les JSON ingérés sont conservés 24 mois, pour pouvoir retraiter les anciens imports quand le parseur évolue.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n          <div style=\"border: 1px dashed var(--bordure); border-radius: 18px; padding: 40px; text-align: center; background: var(--panneau); display: flex; flex-direction: column; gap: 10px; align-items: center;\">\n            <div style=\"font-size: 16px; font-weight: 700;\">Déposer l'archive .zip<\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--text-muted);\">Les JSON bruts sont conservés 24 mois.<\u002Fdiv>\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Button\" variant=\"primaire\" size=\"md\" hint-size=\"auto,40px\">Choisir un fichier<\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-muted); line-height: 1.55; text-wrap: pretty;\">Avec un seul import, les modules Croissance, Acquisition et Listes resteront inactifs : sans deuxième photographie de l'audience, aucun départ ne peut être établi.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCroissance }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1280px; min-width: 0;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n            <h1 style=\"margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em;\">Croissance et départs<\u002Fh1>\n            <span style=\"font-size: 13px; color: var(--text-muted);\">Arrivées et départs des cohortes suivies · abonnés 27 mai → 27 août<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start;\">\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,320px\">\n              <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Arrivées et départs par cohorte<\u002Fh2>\n                  <span style=\"font-size: 13px; color: var(--text-muted);\">Deux échelles distinctes : à l'échelle des arrivées, les départs seraient invisibles. Ces volumes sont ceux des 6 948 comptes comparables, pas ceux du compte entier.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\"><span>Arrivées<\u002Fspan><span>max 1 779<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; min-width: 0;\">\n                    <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                      <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center; background: {{ b.peakBg }}; border-radius: 10px; padding: 6px 4px; min-width: 0;\">\n                        <span style=\"font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;\">{{ b.n }}<\u002Fspan>\n                        <div style=\"width: 100%; max-width: 34px; border-radius: 5px 5px 0 0; background: var(--bleu); height: {{ b.hIn }};\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\"><span>Départs constatés à ce jour<\u002Fspan><span>max 345<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; min-width: 0;\">\n                    <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                      <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center; background: {{ b.peakBg }}; border-radius: 10px; padding: 6px 4px; min-width: 0;\">\n                        <span style=\"font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;\">{{ b.lost }}<\u002Fspan>\n                        <div style=\"width: 100%; max-width: 34px; border-radius: 5px 5px 0 0; background: #A8A196; height: {{ b.hOut2 }};\"><\u002Fdiv>\n                        <span style=\"font-size: 11px; color: var(--text-muted); text-align: center;\">{{ b.label }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 12px; color: var(--text-muted);\">Les semaines surlignées sont les pics d'acquisition, inférés du volume d'arrivées.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,320px\">\n              <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Taux de départ mesuré<\u002Fdiv>\n                  <div style=\"font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;\">16,4 %<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: var(--text-muted);\">1 138 comptes sur 6 948 suivis<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border-top: 1px solid var(--bordure-carte); padding-top: 16px; display: flex; flex-direction: column; gap: 6px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Renommages présumés<\u002Fdiv>\n                  <div style=\"font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--text-muted);\">non distingués<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">Un compte qui change de pseudonyme disparaît de l'export et ressemble à un départ. Tant qu'un troisième import ne confirme pas la persistance de l'identifiant interne, une part inconnue des 1 138 départs sont des renommages.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n          <\u002Fdiv>\n\n          <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,360px\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Derniers départs<\u002Fh2>\n                  <span style=\"font-size: 13px; color: var(--text-muted);\">8 lignes affichées sur 1 138. Aucune date exacte : l'écart entre deux imports est de 5 semaines.<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ agence }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button sc-camel-on-click=\"{{ toggleReveal }}\" style=\"cursor: pointer; border: 1px solid var(--bordure); background: transparent; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--encre);\">{{ revealLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lecture }}\">\n                  <span style=\"font-size: 13px; color: var(--text-muted);\">Accès aux identités non autorisé pour ce rôle.<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ reveal }}\">\n                <div style=\"background: var(--pastel-jaune); border-radius: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.5; text-wrap: pretty;\">Données personnelles affichées. L'usage se limite à l'analyse interne, la consultation est journalisée, et la republication de ces identifiants est interdite.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"overflow-x: auto; min-width: 0;\">\n                <sc-raw-table style=\"width: 100%; min-width: 620px; font-size: 14px;\">\n                  <sc-raw-thead>\n                    <sc-raw-tr style=\"text-align: left; color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\">\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600;\">Compte<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600;\">Abonné depuis<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600;\">Cohorte<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600;\">Parti<\u002Fsc-raw-th>\n                      <sc-raw-th style=\"padding: 0 0 10px; font-weight: 600; text-align: right;\">Ancienneté<\u002Fsc-raw-th>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ departs }}\" as=\"d\" hint-placeholder-count=\"8\">\n                      <sc-raw-tr style=\"border-top: 1px solid var(--bordure-carte);\">\n                        <sc-raw-td style=\"padding: 11px 0; font-weight: 600;\">{{ d.id }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 0; color: var(--text-muted);\">{{ d.sub }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 0; color: var(--text-muted);\">{{ d.coh }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 0;\">{{ d.inter }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding: 11px 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted);\">{{ d.anc }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n          <div style=\"background: var(--encre); color: var(--surface-creme); border-radius: 18px; padding: 18px 22px; display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"font-size: 14px; line-height: 1.55; text-wrap: pretty;\">Meta annonce 9 260 désabonnements. Nous en identifions 1 138 nommément, soit 12,3 %. L'écart tient à la fenêtre glissante de l'export : les abonnés arrivés avant le 27 mai n'y figurent pas.<\u002Fdiv>\n            <div style=\"font-size: 14px; color: rgba(250,248,243,0.75); line-height: 1.55; text-wrap: pretty;\">Un export sur toute la période porterait cette couverture à près de 100 %.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAudience }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1280px; min-width: 0;\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;\">\n            <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n              <h1 style=\"margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em;\">Audience<\u002Fh1>\n              <span style=\"font-size: 13px; color: var(--text-muted);\">102 497 abonnés · dernier import du 27 août<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleOverlap }}\" style=\"cursor: pointer; border: 1px solid var(--bordure); background: transparent; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--encre);\">{{ overlapLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ overlap }}\">\n            <div style=\"background: var(--pastel-jaune); border-radius: 18px; padding: 16px 20px; font-size: 14px; line-height: 1.5; text-wrap: pretty;\">Les deux périodes comparées se recouvrent à 62 %. Les évolutions ne sont pas interprétables : une même partie de l'audience est comptée dans les deux fenêtres. Les flèches d'évolution sont retirées jusqu'à ce que deux fenêtres disjointes soient disponibles.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,240px\">\n            <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0;\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                <h2 style=\"margin: 0; font-size: 19px; font-weight: 800;\">Part France face à l'objectif<\u002Fh2>\n                <span style=\"font-size: 13px; color: var(--text-muted);\">Objectif fixé à 51 %. La marque s'en éloigne.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Import précédent<\u002Fdiv>\n                  <div style=\"font-size: 30px; font-weight: 700;\">43 %<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Aujourd'hui<\u002Fdiv>\n                  <div style=\"font-size: 30px; font-weight: 800;\">41,1 %<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Objectif<\u002Fdiv>\n                  <div style=\"font-size: 30px; font-weight: 700; color: var(--bleu);\">51 %<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                  <div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);\">Écart<\u002Fdiv>\n                  <div style=\"font-size: 30px; font-weight: 700;\">9,9 pts<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 12px;\"><span style=\"font-weight: 600;\">Part en stock, mesurée<\u002Fspan><span style=\"font-variant-numeric: tabular-nums;\">41,1 %<\u002Fspan><\u002Fdiv>\n                  <div style=\"position: relative; height: 12px; background: var(--creme-fonce); border-radius: 999px;\">\n                    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 41.1%; background: var(--bleu); border-radius: 999px;\"><\u002Fdiv>\n                    <div style=\"position: absolute; left: 51%; top: -6px; bottom: -6px; width: 2px; background: var(--encre);\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 12px;\"><span style=\"font-weight: 600;\">Part du flux entrant, estimée<\u002Fspan><span style=\"font-variant-numeric: tabular-nums;\">31 % ± 7 pts<\u002Fspan><\u002Fdiv>\n                  <div style=\"position: relative; height: 12px; background: var(--creme-fonce); border-radius: 999px;\">\n                    <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 31%; border-radius: 999px; border: 1px dashed var(--bleu); background: repeating-linear-gradient(135deg, rgba(5,51,156,0.28) 0 5px, rgba(5,51,156,0.08) 5px 10px);\"><\u002Fdiv>\n                    <div style=\"position: absolute; left: 24%; width: 14%; top: -4px; bottom: -4px; border-left: 1px solid var(--bleu); border-right: 1px solid var(--bleu);\"><\u002Fdiv>\n                    <div style=\"position: absolute; left: 51%; top: -6px; bottom: -6px; width: 2px; background: var(--encre);\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 13px; color: var(--text-muted); line-height: 1.5; text-wrap: pretty;\">La seconde série est une inférence par différence de stocks entre les deux imports, hachurée pour cette raison, avec sa marge d'erreur. Elle dit ce que le stock ne dit pas : le flux entrant est très en dessous de la cible, c'est lui qu'il faut corriger.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fx-import>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start;\">\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,300px\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px; min-width: 0;\">\n                <h2 style=\"margin: 0; font-size: 17px; font-weight: 800;\">Pays et villes<\u002Fh2>\n                <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n                  <div style=\"display: flex; align-items: center; gap: 12px;\"><span style=\"width: 120px;\">France<\u002Fspan><div style=\"flex: 1; height: 8px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: 82%; height: 100%; background: var(--bleu);\"><\u002Fdiv><\u002Fdiv><span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums;\">41,1 %<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 12px;\"><span style=\"width: 120px;\">Algérie<\u002Fspan><div style=\"flex: 1; height: 8px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: 28%; height: 100%; background: #A8A196;\"><\u002Fdiv><\u002Fdiv><span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums;\">13,9 %<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 12px;\"><span style=\"width: 120px;\">Inde<\u002Fspan><div style=\"flex: 1; height: 8px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: 14%; height: 100%; background: #A8A196;\"><\u002Fdiv><\u002Fdiv><span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums;\">7 %<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 12px;\"><span style=\"width: 120px;\">Égypte<\u002Fspan><div style=\"flex: 1; height: 8px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: 9%; height: 100%; background: #A8A196;\"><\u002Fdiv><\u002Fdiv><span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums;\">4,3 %<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 12px;\"><span style=\"width: 120px;\">Royaume-Uni<\u002Fspan><div style=\"flex: 1; height: 8px; background: var(--creme-fonce); border-radius: 999px; overflow: hidden;\"><div style=\"width: 5%; height: 100%; background: #A8A196;\"><\u002Fdiv><\u002Fdiv><span style=\"width: 52px; text-align: right; font-variant-numeric: tabular-nums;\">2,2 %<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border-top: 1px solid var(--bordure-carte); padding-top: 12px; display: flex; gap: 20px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap;\">\n                  <span>Alger 2,8 %<\u002Fspan><span>Paris 1,8 %<\u002Fspan><span>Le Caire 1,2 %<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fx-import>\n\n            <x-import component-from-global-scope=\"BienfaitDesignSystem_6e2c75.Card\" variant=\"claire\" interactive=\"{{ no }}\" hint-size=\"100%,300px\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px; min-width: 0;\">\n                <h2 style=\"margin: 0; font-
