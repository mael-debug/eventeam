{ return () => this.setState(st => ({ ratings: { ...st.ratings, [k]: st.ratings[k] === v ? null : v } })); }\n  renderVals() {\n    const s = this.state.screen;\n    const H = this.state.horizon;\n    const lecture = this.state.role === \"marque\";\n    const pct = v => v.toFixed(1).replace(\".\", \",\") + \" %\";\n    const trunc = c => c.rate * Fd(H) / Fd(c.exp);\n    const rows = COHORTS.map(c => {\n      const ok = c.exp >= H;\n      return {\n        key: c.key, n: fr(c.n), lost: fr(c.lost), exp: c.exp + \" j\",\n        brut: pct(c.rate),\n        tronque: ok ? pct(trunc(c)) : \"—\",\n        ok, insuff: !ok,\n        raison: \"exposition \" + c.exp + \" j, inférieure à l'horizon de \" + H + \" j\",\n        barW: ok ? Math.min(100, (trunc(c) / 25) * 100) + \"%\" : \"0%\",\n        barBg: c.early ? \"#A8A196\" : \"var(--bleu)\",\n        rowBg: ok ? \"transparent\" : \"var(--panneau)\",\n        fg: ok ? \"var(--encre)\" : \"var(--text-muted)\"\n      };\n    });\n\n    const navBg = {}, navFg = {}, navFw = {};\n    Object.keys(LABELS).forEach(k => {\n      const on = k === s;\n      navBg[k] = on ? \"rgba(250,248,243,0.12)\" : \"transparent\";\n      navFg[k] = on ? \"#FAF8F3\" : \"rgba(250,248,243,0.62)\";\n      navFw[k] = on ? \"700\" : \"500\";\n    });\n\n    const X0 = 52, X1 = 604, Y0 = 24, Y1 = 300, DMAX = 100, PMIN = 60;\n    const xOf = d => X0 + (d / DMAX) * (X1 - X0);\n    const yOf = p => Y0 + ((100 - p) / (100 - PMIN)) * (Y1 - Y0);\n    const grid = [100, 90, 80, 70, 60].map(p => ({ y: yOf(p), ty: yOf(p) + 4, label: p + \" %\" }));\n    const xticks = [0, 15, 30, 45, 60, 75, 90].map(d => ({ x: xOf(d), label: d === 0 ? \"arrivée\" : d + \" j\" }));\n\n    const chips = COHORTS.map(c => {\n      const on = !this.state.off[c.key];\n      return {\n        label: c.key, key: c.key,\n        bg: on ? (c.early ? \"#EFEDE8\" : \"var(--bleu-bg)\") : \"transparent\",\n        fg: on ? (c.early ? \"#5B564C\" : \"var(--bleu)\") : \"#9A948A\",\n        border: on ? (c.early ? \"#D3CEC5\" : \"#C3D2EE\") : \"var(--bordure-carte)\",\n        toggle: () => this.setState(st => ({ off: { ...st.off, [c.key]: !st.off[c.key] } }))\n      };\n    });\n\n    const shades = [\"#0A44BE\", \"#05339C\", \"#123C8F\", \"#2C4F9E\", \"#4667B4\"];\n    let si = -1;\n    const lines = COHORTS.filter(c => !this.state.off[c.key]).map(c => {\n      if (!c.early) si += 1;\n      const color = c.early ? \"#A8A196\" : shades[si % shades.length];\n      const stops = [0, 14, 21, 30, 45, 60, 90].filter(d => d < c.exp).concat([c.exp]);\n      const pts = stops.map(d => `${xOf(d)},${yOf(100 - c.rate * Fd(d) / Fd(c.exp))}`).join(\" \");\n      const cx = xOf(c.exp), cy = yOf(100 - c.rate);\n      return {\n        label: c.key, color, w: c.early ? 1.5 : 2.4, solid: pts,\n        cx, cy, lx: Math.min(cx + 7, 596), ly: cy + (c.early ? -7 : 13)\n      };\n    });\n    const hx = xOf(H);\n\n    const peaks = PEAKS.map(p => {\n      const c = COHORTS.find(x => x.key === p.coh);\n      const ok = c.exp >= H;\n      const tx = ok ? trunc(c) : c.rate;\n      const survieP = 1 - tx / 100;\n      const raw = this.state.budgets[p.k] || \"\";\n      const B = parseFloat(String(raw).replace(/[^\\d.]/g, \"\")) || 0;\n      const cons = Math.round(p.vol * survieP);\n      return {\n        k: p.k, vol: fr(p.vol), mult: p.mult, forme: p.forme, nuit: p.nuit, nature: p.nature,\n        natureBg: p.nature === \"probablement payant\" ? \"var(--bleu-bg)\" : p.nature === \"probablement viral\" ? \"var(--vert-pastel)\" : \"var(--pastel-jaune)\",\n        ret: pct(100 - tx) + (ok ? \"\" : \" hors horizon\"),\n        cons: fr(cons), budget: raw,\n        onBudget: e => { const v = e.target.value; this.setState(st => ({ budgets: { ...st.budgets, [p.k]: v } })); },\n        brut: B ? eur(B / p.vol) : \"—\",\n        reel: B ? eur(B / cons) : \"—\"\n      };\n    });\n    const budTot = PEAKS.reduce((a, p) => a + (parseFloat(String(this.state.budgets[p.k] || \"\").replace(/[^\\d.]/g, \"\")) || 0), 0);\n    const consTot = PEAKS.reduce((a, p) => {\n      const B = parseFloat(String(this.state.budgets[p.k] || \"\").replace(/[^\\d.]/g, \"\")) || 0;\n      if (!B) return a;\n      const c = COHORTS.find(x => x.key === p.coh);\n      const tx = c.exp >= H ? trunc(c) : c.rate;\n      return a + p.vol * (1 - tx / 100);\n    }, 0);\n    const volTot = PEAKS.reduce((a, p) => a + (parseFloat(String(this.state.budgets[p.k] || \"\").replace(/[^\\d.]/g, \"\")) ? p.vol : 0), 0);\n\n    const risk = RISK.map(r => ({ l: r.l, part: r.part + \" %\", h: Math.round((r.part / 41) * 130) + \"px\",\n      bg: r.part >= 30 ? \"var(--bleu)\" : \"#A8A196\" }));\n    const crois = CROISEMENTS.map(x => ({ ...x, cl: CONF[x.c].l, cbg: CONF[x.c].bg, cfg: CONF[x.c].fg }));\n    const terr = TERRITOIRES.map(x => ({ ...x, cl: CONF[x.c].l, cbg: CONF[x.c].bg, cfg: CONF[x.c].fg, barW: parseInt(x.ret) + \"%\" }));\n\n    // Croissance — arrivées / départs par semaine de cohorte\n    const maxN = 1779;\n    const bars = COHORTS.map((c, i) => ({\n      label: c.key,\n      hIn: Math.round((c.n / maxN) * 120) + \"px\",\n      hOut: Math.round((c.lost / maxN) * 120) + \"px\",\n      n: fr(c.n), lost: fr(c.lost), hOut2: Math.round((c.lost / 345) * 110) + \"px\",\n      peak: c.n >= 1000,\n      peakBg: c.n >= 1000 ? \"var(--bleu-bg)\" : \"transparent\"\n    }));\n\n    // Catalogue\n    const cat = CATALOGUE.map(g => ({\n      m: g.m,\n      items: g.items.map(it => {\n        const k = it.t;\n        const st = STATUTS[it.s];\n        const r = this.state.ratings[k];\n        const mk = v => ({\n          label: v,\n          bg: r === v ? \"var(--encre)\" : \"transparent\",\n          fg: r === v ? \"#FAF8F3\" : \"var(--text-muted)\",\n          bd: r === v ? \"var(--encre)\" : \"var(--bordure)\",\n          on: this.rate(k, v)\n        });\n        return {\n          t: it.t, w: it.w || \"\", hasW: !!it.w,\n          sLabel: st.label, sBg: st.bg, sFg: st.fg, sBd: st.bd,\n          r1: mk(\"Indispensable\"), r2: mk(\"Souhaitable\"), r3: mk(\"Sans intérêt\"),\n          note: this.state.notes[k] || \"\",\n          onNote: e => { const v = e.target.value; this.setState(x => ({ notes: { ...x.notes, [k]: v } })); }\n        };\n      })\n    }));\n    const rated = Object.values(this.state.ratings).filter(Boolean).length;\n\n    const eco = ECO.filter(e => !this.state.ecoFilter || !e.rep).map(e => ({\n      c: e.c, t: e.t, p: e.p,\n      r: e.r ? \"Oui\" : \"Non\",\n      rep: e.rep ? \"Répondu\" : \"Jamais\",\n      repFg: e.rep ? \"var(--encre)\" : \"var(--text-muted)\"\n    }));\n\n    const departs = DEPARTS.map(d => ({\n      id: this.state.reveal ? d.h : \"compte \" + d.id,\n      sub: d.sub, coh: d.coh, anc: d.anc,\n      inter: \"entre le 22/07 et le 27/08\"\n    }));\n\n    const etatIdx = this.state.etat;\n    const etats = IMPORT_ETATS.map((label, i) => ({\n      label,\n      bg: i === etatIdx ? \"var(--encre)\" : \"transparent\",\n      fg: i === etatIdx ? \"#FAF8F3\" : \"var(--text-muted)\",\n      bd: i === etatIdx ? \"var(--encre)\" : \"var(--bordure)\",\n      on: () => this.setState({ etat: i })\n    }));\n\n    return {\n      no: false, logoSize: 30,\n      isOverview: s === \"overview\", isAcq: s === \"acq\", isBoot: s === \"boot\",\n      isAudience: s === \"audience\", isCroissance: s === \"croissance\",\n      isContenu: s === \"contenu\", isEcosysteme: s === \"ecosysteme\",\n      isListes: s === \"listes\", isCatalogue: s === \"catalogue\",\n      isImports: s === \"imports\", isParametres: s === \"parametres\",\n      isTodo: ![\"overview\", \"acq\", \"boot\", \"audience\", \"croissance\", \"contenu\", \"ecosysteme\", \"listes\", \"catalogue\", \"imports\", \"parametres\", \"diagnostic\", \"segments\", \"journal\", \"login\", \"marques\", \"unimport\"].includes(s),\n      todoLabel: LABELS[s] || \"\",\n      bars, cat, catRated: rated + \" / 42 arbitrées\", eco, departs, etats,\n      posts: POSTS.map(p => ({ ...p, porteeF: fr(p.portee), gagnesF: fr(p.gagnes),\n        alerte: p.flag, alerteBg: p.flag ? \"var(--pastel-jaune)\" : \"transparent\",\n        tauxColor: p.flag ? \"var(--text-muted)\" : \"var(--encre)\" })),\n      reveal: this.state.reveal,\n      revealLabel: this.state.reveal ? \"Masquer les identifiants\" : \"Révéler les identifiants\",\n      toggleReveal: () => this.setState(st => ({ reveal: !st.reveal })),\n      overlap: this.state.overlap,\n      overlapLabel: this.state.overlap ? \"Revenir à des fenêtres comparables\" : \"Simuler des fenêtres recouvrantes\",\n      toggleOverlap: () => this.setState(st => ({ overlap: !st.overlap })),\n      ecoFilter: this.state.ecoFilter,\n      ecoFilterLabel: this.state.ecoFilter ? \"Voir tous les comptes\" : \"Jamais eu de réponse\",\n      ecoFilterBg: this.state.ecoFilter ? \"var(--encre)\" : \"transparent\",\n      ecoFilterFg: this.state.ecoFilter ? \"#FAF8F3\" : \"var(--text-muted)\",\n      toggleEco: () => this.setState(st => ({ ecoFilter: !st.ecoFilter })),\n      etatVide: etatIdx === 0, etatDecomp: etatIdx === 1, etatInv: etatIdx === 2,\n      etatTrait: etatIdx === 3, etatOk: etatIdx === 4, etatKo: etatIdx === 5,\n      navBg, navFg, navFw,\n      goOverview: this.go(\"overview\"), goAudience: this.go(\"audience\"),\n      goCroissance: this.go(\"croissance\"), goAcq: this.go(\"acq\"),\n      goContenu: this.go(\"contenu\"), goEcosysteme: this.go(\"ecosysteme\"),\n      goListes: this.go(\"listes\"), goCatalogue: this.go(\"catalogue\"),\n      goImports: this.go(\"imports\"), goParametres: this.go(\"parametres\"),\n      goBoot: this.go(\"boot\"),\n      rows, peaks, risk, crois, terr, hx,\n      horizon: H, horizonLabel: H + \" jours\",\n      onHorizon: e => this.setState({ horizon: parseInt(e.target.value, 10) }),\n      budTotLabel: budTot ? fr(budTot) + \" €\" : \"aucun budget saisi\",\n      volTotLabel: fr(volTot), consTotLabel: fr(Math.round(consTot)),\n      coutBrutTot: budTot && volTot ? eur(budTot / volTot) : \"—\",\n      coutReelTot: budTot && consTot ? eur(budTot / consTot) : \"—\",\n      ecartTot: budTot && consTot ? \"×\" + (volTot / consTot).toFixed(2).replace(\".\", \",\") : \"—\",\n      lecture, agence: !lecture,\n      roleLabel: lecture ? \"Marque · lecture seule\" : \"Agence · accès complet\",\n      toggleRole: () => this.setState(st => ({ role: st.role === \"agence\" ? \"marque\" : \"agence\", reveal: false })),\n      journal: JOURNAL, segments: SEGMENTS,\n      isDiagnostic: s === \"diagnostic\", isSegments: s === \"segments\",\n      isJournal: s === \"journal\", isLogin: s === \"login\", isMarques: s === \"marques\",\n      isUnImport: s === \"unimport\",\n      goDiagnostic: this.go(\"diagnostic\"), goSegments: this.go(\"segments\"),\n      goJournal: this.go(\"journal\"), goLogin: this.go(\"login\"),\n      goMarques: this.go(\"marques\"), goUnImport: this.go(\"unimport\"),\n      grid, xticks, chips, lines\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
